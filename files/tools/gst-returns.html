<script>
"use strict";
/* ======================================================= masters */
const STATES={"01":"Jammu and Kashmir","02":"Himachal Pradesh","03":"Punjab","04":"Chandigarh","05":"Uttarakhand","06":"Haryana","07":"Delhi","08":"Rajasthan","09":"Uttar Pradesh","10":"Bihar","11":"Sikkim","12":"Arunachal Pradesh","13":"Nagaland","14":"Manipur","15":"Mizoram","16":"Tripura","17":"Meghalaya","18":"Assam","19":"West Bengal","20":"Jharkhand","21":"Odisha","22":"Chhattisgarh","23":"Madhya Pradesh","24":"Gujarat","26":"Dadra and Nagar Haveli and Daman and Diu","27":"Maharashtra","29":"Karnataka","30":"Goa","31":"Lakshadweep","32":"Kerala","33":"Tamil Nadu","34":"Puducherry","35":"Andaman and Nicobar Islands","36":"Telangana","37":"Andhra Pradesh","38":"Ladakh","97":"Other Territory","96":"Other Countries"};
const RATES=[0,0.1,0.25,1,1.5,3,5,6,7.5,12,18,28,40];
const UQC=["NOS","PCS","KGS","GMS","LTR","MTR","BOX","PAC","SET","BAG","BTL","DOZ","SQM","SQF","TON","QTL","MLT","CTN","ROL","UNT","PRS","OTH","NA"];
const DOCN={1:"Invoices for outward supply",2:"Invoices for inward supply from unregistered person",3:"Revised invoice",4:"Debit note",5:"Credit note",6:"Receipt voucher",7:"Payment voucher",8:"Refund voucher",9:"Delivery challan for job work",10:"Delivery challan for supply on approval",11:"Delivery challan in case of liquid gas",12:"Delivery challan in other cases"};
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const B2CL_LIMIT=100000;

/* ======================================================= helpers */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const r2=n=>Math.round((+n||0)*100)/100;
const inr=n=>(n<0?"−":"")+"₹"+Math.abs(+n||0).toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2});
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function toast(m,ms){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("on"),ms||2600);}
const BR=(()=>{try{return window.AndroidBridge||(parent!==window&&parent.AndroidBridge)||null;}catch(e){return window.AndroidBridge||null;}})();
const IN_APP=!!BR||/; wv\)/.test(navigator.userAgent);
function save(name,text,mime){
  if(BR&&BR.saveFile){try{BR.saveFile(name,mime||"application/json",text);toast("Saved to Downloads/Tax Sphere: "+name,3500);return;}catch(e){}}
  const b=new Blob([text],{type:mime||"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},800);toast("Downloaded "+name);
}
function armed(btn,label,fn){ // two-tap confirm (dialogs don't show in the Android app)
  if(btn._arm){btn._arm=0;btn.textContent=label;fn();return;}
  btn._arm=1;const old=btn.textContent;btn.textContent="Tap again to confirm";setTimeout(()=>{if(btn._arm){btn._arm=0;btn.textContent=old;}},3000);
}
// GSTIN: format + checksum
const GSTIN_RE=/^[0-9]{2}[A-Z]{5}[0-9]{4}[A-Z][1-9A-Z]Z[0-9A-Z]$/;
const UIN_RE=/^[0-9]{4}[A-Z]{3}[0-9]{5}[UO]N[A-Z0-9]$/;
function gstinCheck(g){
  g=String(g||"").toUpperCase().trim();
  if(!GSTIN_RE.test(g))return UIN_RE.test(g)?"ok":"format";
  const cs="0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ";let sum=0;
  for(let i=0;i<14;i++){const p=cs.indexOf(g[i])*(i%2?2:1);sum+=Math.floor(p/36)+p%36;}
  return cs[(36-sum%36)%36]===g[14]?(STATES[g.slice(0,2)]?"ok":"state"):"checksum";
}
const gMsg={format:"GSTIN format is wrong (15 characters, e.g. 27ABCDE1234F1Z5)",checksum:"GSTIN check digit doesn't match (typo?)",state:"GSTIN state code is not valid"};
// dates: stored YYYY-MM-DD; JSON DD-MM-YYYY
const dmy=d=>{if(!d)return"";const[y,m,dd]=d.split("-");return`${dd}-${m}-${y}`;};
function parseDate(v){
  if(v==null||v==="")return"";
  if(typeof v==="number"&&v>20000&&v<80000){const d=new Date(Math.round((v-25569)*864e5));return d.toISOString().slice(0,10);}  // Excel serial
  const s=String(v).trim();let m;
  if((m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/)))return`${m[1]}-${m[2].padStart(2,"0")}-${m[3].padStart(2,"0")}`;
  if((m=s.match(/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{2,4})$/))){let y=m[3];if(y.length===2)y="20"+y;return`${y}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`;}
  if((m=s.match(/^(\d{1,2})[-\s]([A-Za-z]{3})[A-Za-z]*[-\s](\d{2,4})$/))){const mi=MON.findIndex(x=>x.toLowerCase()===m[2].toLowerCase());if(mi>=0){let y=m[3];if(y.length===2)y="20"+y;return`${y}-${String(mi+1).padStart(2,"0")}-${m[1].padStart(2,"0")}`;}}
  return"";
}
function stateCode(v){
  if(v==null)return"";const s=String(v).trim();if(!s)return"";
  if(/^\d{1,2}$/.test(s))return s.padStart(2,"0");
  const m=s.match(/^(\d{2})\s*[-–]/);if(m)return m[1];
  const n=s.toLowerCase().replace(/&/g,"and").replace(/[^a-z]/g,"");
  for(const[c,nm]of Object.entries(STATES))if(nm.toLowerCase().replace(/[^a-z]/g,"")===n)return c;
  const alias={orissa:"21",pondicherry:"34",uttaranchal:"05",newdelhi:"07",jammuandkashmir:"01",dadraandnagarhaveli:"26",damananddiu:"26",telengana:"36"};
  return alias[n]||"";
}
const num=v=>{const n=parseFloat(String(v??"").replace(/[,₹\s]/g,""));return isFinite(n)?n:0;};

/* ======================================================= store */
const KEY="semi.gstStudio.v1";
let DB={clients:[],cur:null,period:null,data:{}};
function load(){try{const s=localStorage.getItem(KEY);if(s)DB=Object.assign(DB,JSON.parse(s));}catch(e){}}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(DB));}catch(e){toast("Couldn't save: storage full");}}
const client=()=>DB.clients.find(c=>c.gstin===DB.cur)||null;
const pkey=()=>DB.cur&&DB.period?DB.cur+"_"+DB.period:null;
function R(){const k=pkey();if(!k)return null;if(!DB.data[k])DB.data[k]={sales:[],notes:[],exports:[],nil:{INTRB2B:{},INTRAB2B:{},INTRB2C:{},INTRAB2C:{}},docsManual:[],itc:{},meta:{}};return DB.data[k];}
const fp=()=>DB.period; // MMYYYY
const home=()=>(client()||{}).gstin?.slice(0,2)||"";

/* ======================================================= tax engine */
function itemTax(it,inter,noTax){
  const tx=r2(num(it.tx)),rt=num(it.rt),cs=r2(num(it.cs));
  if(noTax)return{tx,rt,iamt:0,camt:0,samt:0,csamt:0};
  const t=tx*rt/100;
  return inter?{tx,rt,iamt:r2(t),camt:0,samt:0,csamt:cs}:{tx,rt,iamt:0,camt:r2(t/2),samt:r2(t/2),csamt:cs};
}
const isInter=(pos,typ)=>typ==="SEWP"||typ==="SEWOP"||pos!==home();
function docCalc(d,kind){ // returns {inter, lines:[{...tax}], tx,tax,val}
  const typ=kind==="exp"?"EXP":(d.typ||"R"),pos=kind==="exp"?"96":d.pos,inter=kind==="exp"?true:isInter(pos,typ);
  const noTax=typ==="SEWOP"||(kind==="exp"&&d.exp==="WOPAY");
  const lines=(d.items||[]).map(it=>Object.assign({hsn:String(it.hsn||"").trim(),desc:it.desc||"",uqc:it.uqc||"",qty:num(it.qty)},itemTax(it,inter,noTax)));
  const tx=r2(lines.reduce((a,l)=>a+l.tx,0)),tax=r2(lines.reduce((a,l)=>a+l.iamt+l.camt+l.samt+l.csamt,0));
  return{inter,lines,tx,tax,val:r2(tx+tax)};
}
const rateWise=lines=>{const m={};for(const l of lines){const k=l.rt;m[k]=m[k]||{rt:l.rt,tx:0,iamt:0,camt:0,samt:0,csamt:0};for(const f of["tx","iamt","camt","samt","csamt"])m[k][f]=r2(m[k][f]+l[f]);}return Object.values(m).sort((a,b)=>a.rt-b.rt);};
function classify(s){const c=docCalc(s,"sale");if(s.ctin)return"B2B";if(c.inter&&c.val>B2CL_LIMIT)return"B2CL";return"B2CS";}

/* ======================================================= GSTR-1 builder */
function buildR1(){
  const d=R(),out={b2b:[],b2cl:[],b2cs:[],exp:[],cdnr:[],cdnur:[],hsnB2B:{},hsnB2C:{},nil:[],docs:[],totals:{}};
  const addHSN=(bucket,l,sign)=>{
    const svc=/^99/.test(l.hsn),uqc=svc?"NA":(l.uqc||"OTH"),k=l.hsn+"|"+l.rt+"|"+uqc;
    const h=bucket[k]=bucket[k]||{hsn_sc:l.hsn,desc:l.desc||"",uqc,qty:0,rt:l.rt,txval:0,iamt:0,camt:0,samt:0,csamt:0};
    if(!h.desc&&l.desc)h.desc=l.desc;
    h.qty=r2(h.qty+(svc?0:sign*l.qty));for(const[f,g]of[["txval","tx"],["iamt","iamt"],["camt","camt"],["samt","samt"],["csamt","csamt"]])h[f]=r2(h[f]+sign*l[g]);
  };
  const b2b={},b2cl={},b2cs={},exp={WPAY:[],WOPAY:[]},cdnr={};
  for(const s of d.sales){
    const c=docCalc(s,"sale"),cls=classify(s);

  out.b2cl.forEach(g=>g.inv.forEach(i=>{T.count.b2cl++;i.itms.forEach(x=>{T.b2cl=r2(T.b2cl+x.itm_det.txval);acc(x.itm_det,1);});}));
  out.b2cs.forEach(x=>{T.b2cs=r2(T.b2cs+x.txval);acc(x,1);});T.count.b2cs=out.b2cs.length;

function docSeries(){ // Table 13 from registers (series = prefix) + manual rows
  const d=R(),groups={};
  const addDoc=(nature,no)=>{const m=String(no).match(/^(.*?)(\d+)(\D*)$/);const pre=m?m[1]:"",suf=m?m[3]:"",n=m?parseInt(m[2],10):NaN,w=m?m[2].length:0;
    const k=nature+"|"+pre+"|"+suf;const g=groups[k]=groups[k]||{nature,pre,suf,w,list:[]};g.list.push({n,raw:String(no)});};
  d.sales.forEach(s=>addDoc(1,s.no));d.exports.forEach(s=>addDoc(1,s.no));
  d.notes.forEach(n=>addDoc(n.ntty==="D"?4:5,n.no));
  const rows=[];
  for(const g of Object.values(groups)){
    const nums=g.list.filter(x=>isFinite(x.n)).sort((a,b)=>a.n-b.n);if(!nums.length)continue;
    const fmt=n=>g.pre+String(n).padStart(g.w,"0")+g.suf,first=nums[0].n,last=nums[nums.length-1].n,total=last-first+1;
    rows.push({nature:g.nature,from:fmt(first),to:fmt(last),totnum:total,cancel:Math.max(0,total-nums.length),auto:true});
  }
  for(const m of d.docsManual)rows.push({nature:+m.nature,from:m.from,to:m.to,totnum:num(m.totnum),cancel:num(m.cancel),manual:true});
  return rows;
}

/* ======================================================= validation */
function validate(){
  const d=R(),c=client(),iss=[],seen={},[mm,yy]=[+fp().slice(0,2),+fp().slice(2)];
  const pStart=new Date(yy,mm-1,1),pEnd=new Date(yy,mm,0);
  const hsnMin=c&&c.band==="above5"?6:4;
  const chkDoc=(x,kind,tab)=>{
    const tag=`${kind} ${x.no||"(no number)"}`;
    if(!x.no)iss.push({t:"e",m:`${kind} number is missing`,tab,id:x.id});
    else{if(String(x.no).length>16)iss.push({t:"e",m:`${tag}: number longer than 16 characters`,tab,id:x.id});
      if(!/^[A-Za-z0-9/-]+$/.test(x.no))iss.push({t:"e",m:`${tag}: only letters, digits, / and - are allowed`,tab,id:x.id});
      if(/^[0/-]+$/.test(x.no))iss.push({t:"e",m:`${tag}: number can't be all zeros`,tab,id:x.id});
      const k=(tab==="notes"?"N":"I")+String(x.no).toUpperCase();if(seen[k])iss.push({t:"e",m:`${tag}: duplicate number`,tab,id:x.id});seen[k]=1;}
    if(!x.dt)iss.push({t:"e",m:`${tag}: date missing`,tab,id:x.id});
    else{const dt=new Date(x.dt);if(dt>pEnd)iss.push({t:"e",m:`${tag}: date is after the return period`,tab,id:x.id});
      else if(dt<pStart&&tab!=="notes")iss.push({t:"w",m:`${tag}: date is before this period (report in the right month or as an amendment)`,tab,id:x.id});}
    if(kind!=="Export"&&!STATES[x.pos])iss.push({t:"e",m:`${tag}: place of supply missing`,tab,id:x.id});
    if(x.ctin){const g=gstinCheck(x.ctin);if(g!=="ok")iss.push({t:"e",m:`${tag}: ${gMsg[g]}`,tab,id:x.id});if(x.ctin===DB.cur)iss.push({t:"e",m:`${tag}: customer GSTIN is your own GSTIN`,tab,id:x.id});}
    if(x.etin&&gstinCheck(x.etin)!=="ok")iss.push({t:"e",m:`${tag}: e-commerce operator GSTIN is invalid`,tab,id:x.id});
    if(!(x.items||[]).length)iss.push({t:"e",m:`${tag}: no line items`,tab,id:x.id});
    (x.items||[]).forEach((it,i)=>{
      if(!RATES.includes(num(it.rt)))iss.push({t:"e",m:`${tag} line ${i+1}: GST rate ${it.rt}% is not a valid rate`,tab,id:x.id});
      if(!(num(it.tx)>0))iss.push({t:"e",m:`${tag} line ${i+1}: taxable value must be more than 0`,tab,id:x.id});
      const h=String(it.hsn||"").trim();
      if(!/^\d+$/.test(h))iss.push({t:"e",m:`${tag} line ${i+1}: HSN/SAC missing or not numeric`,tab,id:x.id});
      else if(h.length<hsnMin&&(x.ctin||hsnMin===6))iss.push({t:"e",m:`${tag} line ${i+1}: HSN needs at least ${hsnMin} digits for your turnover`,tab,id:x.id});
      else if(![4,6,8].includes(h.length))iss.push({t:"w",m:`${tag} line ${i+1}: HSN/SAC is usually 4, 6 or 8 digits`,tab,id:x.id});
      if(!/^99/.test(h)&&!(num(it.qty)>0))iss.push({t:"w",m:`${tag} line ${i+1}: quantity is 0 for goods (needed in the HSN summary)`,tab,id:x.id});
    });
  };
  if(!c)iss.push({t:"e",m:"Add a business (GSTIN) first",tab:"clients"});
  d.sales.forEach(s=>{chkDoc(s,"Invoice","sales");
    if((s.typ==="SEWP"||s.typ==="SEWOP")&&!s.ctin)iss.push({t:"e",m:`Invoice ${s.no}: SEZ supplies need the SEZ unit's GSTIN`,tab:"sales",id:s.id});
    if(s.typ==="SEWOP"&&s.items.some(it=>num(it.rt)===0))iss.push({t:"w",m:`Invoice ${s.no}: for SEZ without payment, still enter the applicable rate`,tab:"sales",id:s.id});});
  d.notes.forEach(n=>{chkDoc(n,"Note","notes");if(!n.ctin&&!["B2CL","B2CS","EXPWP","EXPWOP"].includes(n.utyp))iss.push({t:"e",m:`Note ${n.no}: choose the unregistered type (B2CL / B2CS / export)`,tab:"notes",id:n.id});});
  d.exports.forEach(x=>{chkDoc(x,"Export","exports");if(x.sbpcode&&!/^[A-Z0-9]{6}$/i.test(x.sbpcode))iss.push({t:"w",m:`Export ${x.no}: port code is usually 6 characters`,tab:"exports",id:x.id});
    if(x.sbnum&&!/^\d{3,7}$/.test(String(x.sbnum)))iss.push({t:"w",m:`Export ${x.no}: shipping bill number is 3–7 digits`,tab:"exports",id:x.id});});
  const o=buildR1();
  o.b2cs.forEach(e=>{if(e.txval<0)iss.push({t:"e",m:`Table 7 (B2CS) ${STATES[e.pos]} @ ${e.rt}% is negative: credit notes exceed sales; adjust against the original month`,tab:"r1"});});
  if(!d.sales.length&&!d.exports.length&&!d.notes.length&&!o.nil.length)iss.push({t:"w",m:"No supplies entered. If there was no business this period, file a nil return on the portal (or by SMS).",tab:"sales"});
  return iss;
}

/* ======================================================= GSTR-3B */
function build3B(){
  const o=buildR1(),d=R(),it=d.itc||{},v=k=>r2(num(it[k]));
  const osup={txval:0,iamt:0,camt:0,samt:0,csamt:0},zero={txval:0,iamt:0,csamt:0},unreg={};
  const add=(t,x,sg)=>{t.txval=r2(t.txval+sg*x.txval);for(const f of["iamt","camt","samt","csamt"])if(f in t)t[f]=r2(t[f]+sg*(x[f]||0));};
  o.b2b.forEach(g=>g.inv.forEach(i=>i.itms.forEach(x=>{if(i.rchrg==="Y")return;(i.inv_typ==="SEWP"||i.inv_typ==="SEWOP")?add(zero,x.itm_det,1):add(osup,x.itm_det,1);})));
  o.b2cl.forEach(g=>g.inv.forEach(i=>i.itms.forEach(x=>{add(osup,x.itm_det,1);const u=unreg[g.pos]=unreg[g.pos]||{pos:g.pos,txval:0,iamt:0};u.txval=r2(u.txval+x.itm_det.txval);u.iamt=r2(u.iamt+x.itm_det.iamt);})));
  o.b2cs.forEach(x=>{add(osup,x,1);if(x.sply_ty==="INTER"){const u=unreg[x.pos]=unreg[x.pos]||{pos:x.pos,txval:0,iamt:0};u.txval=r2(u.txval+x.txval);u.iamt=r2(u.iamt+(x.iamt||0));}});
  o.exp.forEach(g=>g.inv.forEach(i=>i.itms.forEach(x=>add(zero,x,1))));
  o.cdnr.forEach(g=>g.nt.forEach(n=>n.itms.forEach(x=>add((n.inv_typ==="SEWP"||n.inv_typ==="SEWOP")?zero:osup,x.itm_det,n.ntty==="D"?1:-1))));
  o.cdnur.forEach(n=>n.itms.forEach(x=>add(/^EXP/.test(n.typ)?zero:osup,x.itm_det,n.ntty==="D"?1:-1)));
  const nilT=r2(o.nil.reduce((a,x)=>a+x.expt_amt+x.nil_amt,0)),ngT=r2(o.nil.reduce((a,x)=>a+x.ngsup_amt,0));
  const rcm={txval:v("rcm_tx"),iamt:v("rcm_i"),camt:v("rcm_c"),samt:v("rcm_s"),csamt:v("rcm_cs")};
  const avl=[["IMPG","imp_g"],["IMPS","imp_s"],["ISRC","rc"],["ISD","isd"],["OTH","oth"]].map(([ty,p])=>({ty,iamt:v(p+"_i"),camt:ty.startsWith("IMP")?0:v(p+"_c"),samt:ty.startsWith("IMP")?0:v(p+"_s"),csamt:v(p+"_cs")}));
  const rev=[["RUL","rev1"],["OTH","rev2"]].map(([ty,p])=>({ty,iamt:v(p+"_i"),camt:v(p+"_c"),samt:v(p+"_s"),csamt:v(p+"_cs")}));
  const inelg=[["RUL","in1"],["OTH","in2"]].map(([ty,p])=>({ty,iamt:v(p+"_i"),camt:v(p+"_c"),samt:v(p+"_s"),csamt:v(p+"_cs")}));
  const sum=(a,f)=>r2(a.reduce((s,x)=>s+(x[f]||0),0));
  const net={iamt:r2(sum(avl,"iamt")-sum(rev,"iamt")),camt:r2(sum(avl,"camt")-sum(rev,"camt")),samt:r2(sum(avl,"samt")-sum(rev,"samt")),csamt:r2(sum(avl,"csamt")-sum(rev,"csamt"))};
  // liability = outward (osup+zero with payment) + RCM inward
  const L={i:r2(osup.iamt+zero.iamt+rcm.iamt),c:r2(osup.camt+rcm.camt),s:r2(osup.samt+rcm.samt),cs:r2(osup.csamt+zero.csamt+rcm.csamt)};
  // RCM liability must be paid in cash; ITC only against forward-charge liability
  const LF={i:r2(L.i-rcm.iamt),c:r2(L.c-rcm.camt),s:r2(L.s-rcm.samt),cs:r2(L.cs-rcm.csamt)};
  const so=setoff(LF,{i:Math.max(0,net.iamt),c:Math.max(0,net.camt),s:Math.max(0,net.samt),cs:Math.max(0,net.csamt)});
  const cash={i:r2(so.cash.i+rcm.iamt),c:r2(so.cash.c+rcm.camt),s:r2(so.cash.s+rcm.samt),cs:r2(so.cash.cs+rcm.csamt)};
  return{osup,zero,nilT,ngT,rcm,unreg:Object.values(unreg).filter(u=>u.txval),avl,rev,inelg,net,L,so,cash,
    inward:{gst_inter:v("ex_inter"),gst_intra:v("ex_intra"),ng_inter:v("ng_inter"),ng_intra:v("ng_intra")},intr:{iamt:v("int_i"),camt:v("int_c"),samt:v("int_s"),csamt:v("int_cs")}};
}
function setoff(L,C){ // Sec 49/49A/49B + Rule 88A, arranged to minimise cash
  L={...L};C={...C};const U=[];const use=(from,to,amt)=>{amt=r2(Math.min(amt,C[from],L[to]));if(amt>0){C[from]=r2(C[from]-amt);L[to]=r2(L[to]-amt);U.push([from,to,amt]);}};

  return{U,cash:L,left:C};

function r3JSON(){

function sheetKindGR(n){n=String(n).toLowerCase();if(/read ?me|code/.test(n))return null;if(/credit|debit|note/.test(n))return "notes";if(/export/.test(n))return "exports";if(/sale|invoice/.test(n))return "sales";

const isBlank=v=>v==null||String(v).trim()===""||String(v).trim()==="—";
function importOther(kind,rows){
  if(rows.length<2)return null;const h=rows[0].map(nk),ix=(...w)=>{for(const x of w){const i=h.findIndex(y=>y.startsWith(nk(x)));if(i>=0)return i;}return -1;},d=R();let n=0;
  if(kind==="nil"){const ic=ix("Code"),is=ix("Supply"),cols={nil:ix("Nil"),expt:ix("Exempt"),ngsup:ix("Non")};
    for(const r of rows.slice(1)){let code=ic>=0?String(r[ic]).trim().toUpperCase():"";
      if(!d.nil[code]){const t=String(is>=0?r[is]:r[0]).toLowerCase(),inter=/inter-|inter /.test(t)&&!/intra/.test(t),reg=!/unreg/.test(t);code=(inter?"INTR":"INTRA")+(reg?"B2B":"B2C");}
      if(!d.nil[code])continue;for(const [f,i] of Object.entries(cols))if(i>=0&&!isBlank(r[i])){d.nil[code][f]=String(num(r[i]));n++;}}
    return n?`Nil-Exempt ${n} values`:null;}
  if(kind==="docs"){const i={n:ix("Nature no","Nature","No"),f:ix("From"),t:ix("To"),tot:ix("Total"),c:ix("Cancel")};
    for(const r of rows.slice(1)){const nat=parseInt(r[i.n]),from=String(r[i.f]??"").trim(),to=String(r[i.t]??"").trim(),tot=num(r[i.tot]);
      if(!DOCN[nat]||!from||!to||!tot)continue;if(d.docsManual.some(x=>+x.nature===nat&&x.from===from&&x.to===to))continue;
      d.docsManual.push({nature:String(nat),from,to,totnum:tot,cancel:num(r[i.c])||0});n++;}
    return n?`Documents ${n} rows`:null;}
  if(kind==="itc"){const ic=ix("Code"),cols={tv:ix("Taxable","Value"),i:ix("IGST"),c:ix("CGST"),s:ix("SGST"),cs:ix("Cess")};d.itc=d.itc||{};
    for(const r of rows.slice(1)){const code=String(r[ic>=0?ic:0]).trim();const def=ITC3B.find(x=>x[0]===code);if(!def)continue;
      const put=(k,v)=>{if(!isBlank(v)){d.itc[k]=String(num(v));n++;}};
      if(def[2])put(code==="rcm"?"rcm_tx":code,r[cols.tv]);if(def[3])put(code+"_i",r[cols.i]);if(def[4])put(code+"_c",r[cols.c]);if(def[5])put(code+"_s",r[cols.s]);if(def[6])put(code+"_cs",r[cols.cs]);}
    return n?`GSTR-3B inputs ${n} values`:null;}

function importBookGR(book,fallback){

  const todo=named.length?named:[{name:book[0].name,rows:book[0].rows,force:fallback}];

      if(el.dataset.f==="ctin"){const r=gstinCheck(v);$("#gMsg").innerHTML=v&&r!=="ok"?`<div class="note">${gMsg[r]}</div>`:"";el.classList.toggle("err",!!v&&r!=="ok");

    $("#dSave").onclick=()=>{if(!d.no){toast("Enter the number");return;}const list=R()[kind],i=list.findIndex(x=>x.id===d.id);
      if(list.some(x=>x.id!==d.id&&x.no.toUpperCase()===d.no.toUpperCase())){toast("That number already exists");return;}
      d.items=d.items.filter(it=>num(it.tx)||it.hsn);if(i>=0)list[i]=d;else list.push(d);R().meta.r1json=false;persist();EDIT=null;toast("Saved");render();};
    if($("#dCopy"))$("#dCopy").onclick=()=>{EDIT={kind,doc:Object.assign(JSON.parse(JSON.stringify(d)),{id:uid(),no:nextNo(d.no)})};render();toast("Copy created: check the number and save");};
    if($("#dDel"))$("#dDel").onclick=e=>armed(e.target,"Delete",()=>{R()[kind]=R()[kind].filter(x=>x.id!==d.id);persist();EDIT=null;render();});
    $("#dCancel").onclick=()=>{EDIT=null;render();};}
  // others
  $$("[data-nil]").forEach(el=>el.onchange=()=>{const n=R().nil;n[el.dataset.nil]=n[el.dataset.nil]||{};n[el.dataset.nil][el.dataset.k]=el.value;persist();});
  if($("#mdAdd"))$("#mdAdd").onclick=()=>{const t=num($("#mdTot").value),c=num($("#mdC").value);if(!$("#mdF").value||!$("#mdT").value||!t){toast("Fill from, to and total");return;}
    R().docsManual.push({nature:$("#mdN").value,from:$("#mdF").value.trim(),to:$("#mdT").value.trim(),totnum:t,cancel:c});persist();render();};
  $$("[data-rmdoc]").forEach(b=>b.onclick=()=>{R().docsManual.splice(+b.dataset.rmdoc,1);persist();render();});
  // import
  $$("[data-tplx]").forEach(b=>b.onclick=()=>downloadBook(b.dataset.tplx==="1"));
  if($("#impGo")){
    const dest=k=>({sales:"sales",notes:"notes",exports:"exports",nil:"others",docs:"others",itc:"r3b"})[k];
    const run=text=>{try{const k=$("#impK").value,rows=parseTable(text);
      if(["sales","notes","exports"].includes(k)){const r=importRows(k,rows);toast(`Imported ${r.n} documents (${r.lines} lines)`);}
      else{const r=importOther(k,rows);persist();if(!r)throw new Error("Nothing recognised. Paste the sheet with its header row.");toast(r);}
      $("#impTxt").value="";go(dest(k));}catch(e){toast(e.message,4000);}};
    $("#impGo").onclick=()=>run($("#impTxt").value);
    if($("#impFile"))$("#impFile").onchange=async e=>{const f=e.target.files[0];e.target.value="";if(!f)return;
      try{const msg=importBookGR(await XL.read(f,parseTable),$("#impK").value);toast(msg,5000);go("home");}catch(err){toast(err.message,4000);}};
    $("#impSample").onclick=loadSample;
    $("#bk").onclick=()=>save("SEMI_GST_backup_"+new Date().toISOString().slice(0,10)+".json",JSON.stringify(DB));
    $("#rs").onclick=e=>armed(e.target,"Restore",()=>{try{const x=JSON.parse($("#rsTxt").value);if(!x.clients)throw 0;DB=x;persist();toast("Restored");go("home");}catch(_){toast("That isn't a valid backup");}});}
  // GSTR-1
  if($("#genR1")){
    $("#genR1").onclick=()=>{if(validate().some(i=>i.t==="e")){toast("Fix errors first");return;}const j=r1JSON();save(`GSTR1_${DB.cur}_${DB.period}.json`,JSON.stringify(j));R().meta.r1json=true;persist();render();};
    $("#viewJ").onclick=()=>{const p=$("#jprev");p.classList.toggle("hide");p.textContent=JSON.stringify(r1JSON(),null,2);};
    $("#genR1x").onclick=()=>{const o=buildR1(),rows=[["Table","GSTIN/POS","Number","Date","Rate","Taxable","IGST","CGST","SGST","Cess"]];
      o.b2b.forEach(g=>g.inv.forEach(i=>i.itms.forEach(x=>rows.push(["B2B",g.ctin,i.inum,i.idt,x.itm_det.rt,x.itm_det.txval,x.itm_det.iamt||0,x.itm_det.camt||0,x.itm_det.samt||0,x.itm_det.csamt||0]))));
      o.b2cl.forEach(g=>g.inv.forEach(i=>i.itms.forEach(x=>rows.push(["B2CL",g.pos,i.inum,i.idt,x.itm_det.rt,x.itm_det.txval,x.itm_det.iamt||0,0,0,x.itm_det.csamt||0]))));
      o.b2cs.forEach(x=>rows.push(["B2CS",x.pos,"","",x.rt,x.txval,x.iamt||0,x.camt||0,x.samt||0,x.csamt||0]));
      o.exp.forEach(g=>g.inv.forEach(i=>i.itms.forEach(x=>rows.push(["EXP-"+g.exp_typ,"",i.inum,i.idt,x.rt,x.txval,x.iamt,0,0,x.csamt]))));
      o.cdnr.forEach(g=>g.nt.forEach(n=>n.itms.forEach(x=>rows.push(["CDNR-"+n.ntty,g.ctin,n.nt_num,n.nt_dt,x.itm_det.rt,x.itm_det.txval,x.itm_det.iamt||0,x.itm_det.camt||0,x.itm_det.samt||0,x.itm_det.csamt||0]))));
      o.cdnur.forEach(n=>n.itms.forEach(x=>rows.push(["CDNUR-"+n.ntty,n.typ,n.nt_num,n.nt_dt,x.itm_det.rt,x.itm_det.txval,x.itm_det.iamt||0,0,0,x.itm_det.csamt||0])));
      save(`GSTR1_working_${DB.cur}_${DB.period}.csv`,"\ufeff"+rows.map(r=>r.map(csvCell).join(",")).join("\r\n"),"text/csv");};}
  // GSTR-3B
  $$("[data-itc]").forEach(el=>el.onchange=()=>{R().itc[el.dataset.itc]=el.value;persist();});
  if($("#itcSave"))$("#itcSave").onclick=()=>{persist();render();toast("Recalculated");};
  if($("#gen3b")){$("#gen3b").onclick=()=>save(`GSTR3B_${DB.cur}_${DB.period}.json`,JSON.stringify(r3JSON()));
    $("#view3b").onclick=()=>{const p=$("#j3prev");p.classList.toggle("hide");p.textContent=JSON.stringify(r3JSON(),null,2);};}
  if($("#markUp"))$("#markUp").onclick=()=>{const m=R().meta;m.uploaded=!m.uploaded;persist();render();};
}
const nextNo=no=>{const m=String(no).match(/^(.*?)(\d+)(\D*)$/);return m?m[1]+String(+m[2]+1).padStart(m[2].length,"0")+m[3]:no+"-1";};
$("#selClient").onchange=e=>{if(e.target.value==="__new"){EDIT={client:{gstin:"",name:"",freq:"M",band:"upto5"}};TAB="clients";render();return;}DB.cur=e.target.value;persist();go(TAB==="clients"?"home":TAB);};
$("#selPeriod").onchange=e=>{DB.period=e.target.value;persist();go(TAB);};

    {id:uid(),no:"INV/106",dt:D(15),ctin:"",cname:"Customer",pos:"33",rc:"N",typ:"R",etin:"",items:[{hsn:"998314",desc:"Styling consultation",uqc:"NA",qty:0,tx:8000,rt:18,cs:0}]});
  d.notes.push({id:uid(),no:"CN/01",dt:D(20),ntty:"C",ctin:"29ABCDE1234F1ZW",cname:"Sample Traders",pos:"29",rc:"N",typ:"R",utyp:"",etin:"",items:[{hsn:"6204",desc:"Return",uqc:"PCS",qty:4,tx:6000,rt:5,cs:0}]});

load();
if(!DB.period)DB.period=periods()[2][0];
if(!DB.cur&&DB.clients.length)DB.cur=DB.clients[0].gstin;
render();
window.GSTSTUDIO={buildR1,r1JSON,r3JSON,build3B,validate,gstinCheck,setoff,importRows,parseTable,demo,DB:()=>DB};
