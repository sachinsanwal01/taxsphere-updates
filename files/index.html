<meta charset="utf-8">
<script>
/* TaxSphere live updates: boot. If an update has been downloaded, start the app from it instead of the built-in files.
   A start that doesn't finish marks that update bad and the next start uses the built-in version. */
window.SEMI_BUNDLED = window.SEMI_BUNDLED || 25; window.SEMI_APK = window.SEMI_APK || 17;
window.SEMI_BUILD = 25; window.SEMI_NAME = "2.8.2";
window.SEMI_URL = function (p) { return (window.__PATCH && window.__PATCH[p]) || p; };
/* iframe attribute for a tool page: an updated page goes in srcdoc so it keeps the app's storage (a blob: page can't) */
window.SEMI_FRAME = function (p) { var h = window.__PATCH_HTML && window.__PATCH_HTML[p];
  return h ? 'srcdoc="' + h.replace(/&/g, "&amp;").replace(/"/g, "&quot;") + '"' : 'src="' + p + '"'; };
(function () {
  if (window.__SEMI_PATCHED) return;
  var ls; try { ls = window.localStorage; ls.getItem("x"); } catch (e) { return; }
  var pv = +ls.getItem("semi.upd.v") || 0;
  if (pv <= window.SEMI_BUNDLED || !window.indexedDB) return;
  try { if (sessionStorage.getItem("semi.upd.skip")) return; } catch (e) {}
  if (ls.getItem("semi.upd.bad") === String(pv)) return;
  if (ls.getItem("semi.upd.trial") === String(pv)) { ls.setItem("semi.upd.bad", String(pv)); ls.removeItem("semi.upd.trial"); return; }
  document.write('<plaintext style="display:none">');
  var done = false;
  function fail() { if (done) return; done = true; try { sessionStorage.setItem("semi.upd.skip", "1"); } catch (e) {} location.reload(); }
  var to = setTimeout(fail, 6000);
  var rq = indexedDB.open("semi-upd", 1);
  rq.onupgradeneeded = function () { rq.result.createObjectStore("files"); };
  rq.onerror = fail;
  rq.onsuccess = function () {
    var g; try { g = rq.result.transaction("files").objectStore("files").get(pv); } catch (e) { return fail(); }
    g.onerror = fail;
    g.onsuccess = function () {
      var P = g.result; if (!P || !P.files || !P.files["index.html"]) return fail();
      try {
        var dir = location.href.replace(/[?#].*$/, "").replace(/[^\/]*$/, ""), map = {}, html = {};
        for (var k in P.files) {
          if (k === "index.html") continue;
          var t = P.files[k], ty = /\.html$/.test(k) ? "text/html" : /\.js$/.test(k) ? "text/javascript" : /\.svg$/.test(k) ? "image/svg+xml" : /\.json$/.test(k) ? "application/json" : "text/plain";
          if (ty === "text/html") { html[k] = t.replace(/<head([^>]*)>/i, '<head$1><base href="' + dir + k.replace(/[^\/]*$/, "") + '">'); continue; }
          map[k] = URL.createObjectURL(new Blob([t], {type: ty + ";charset=utf-8"}));
        }
        var h = P.files["index.html"].replace(/(<script\b[^>]*\bsrc=")([^"]+)(")/g, function (m, a, s, b) { return a + (map[s] || s) + b; })
          .replace(/(<(?:link|img)\b[^>]*\b(?:href|src)=")([^"]+)(")/g, function (m, a, s, b) { return a + (map[s] || s) + b; });
        clearTimeout(to); done = true;
        /* if the update throws while starting, or hasn't finished starting in 10 s, go back to the built-in version now */
        window.__updGuard = function () { try { if (ls.getItem("semi.upd.trial") !== String(pv)) return; ls.setItem("semi.upd.bad", String(pv)); ls.removeItem("semi.upd.trial"); sessionStorage.setItem("semi.upd.skip", "1"); } catch (e) {} location.reload(); };
        setTimeout(window.__updGuard, 10000);
        h = h.replace(/<head([^>]*)>/i, '<head$1><script>addEventListener("error", function () { window.__updGuard(); });<\/script>');
        window.__PATCH = map; window.__PATCH_HTML = html; window.__SEMI_PATCHED = pv; ls.setItem("semi.upd.trial", String(pv));
        document.open(); document.write(h); document.close();
      } catch (e) { done = false; fail(); }
    };
  };
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TaxSphere</title>
<meta name="description" content="Income tax, GST, accounting, costing and finance tools, concept notes and quizzes for CA, CMA and CS students.">
<meta name="theme-color" content="#6d4aff">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f5fb;--surface:#ffffff;--surface2:#f0eef8;--ink:#16131f;--text:#3b3650;--soft:#6f6987;
  --rule:#e3dff0;--accent:#6d4aff;--accent-ink:#ffffff;--accent-wash:#ece7ff;--lime:#c6f432;--lime-ink:#1c2400;
  --good:#12855a;--good-wash:#e2f6ec;--bad:#c2334d;--bad-wash:#fbe6ea;--shadow:0 1px 2px rgba(22,19,31,.05),0 8px 24px rgba(22,19,31,.06);
  --radius:16px;--sans:"Inter","Segoe UI",system-ui,sans-serif;--display:"Space Grotesk","Inter","Segoe UI",sans-serif;
  --mono:ui-monospace,"Cascadia Mono",Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f0d16;--surface:#191624;--surface2:#221e31;--ink:#f3f0ff;--text:#d3cde6;--soft:#9b94b4;--rule:#2e2942;
  --accent:#9b84ff;--accent-ink:#120a33;--accent-wash:#2a2250;--good:#45d39a;--good-wash:#123326;--bad:#ff7d93;--bad-wash:#3a1a22;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.3);color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0f0d16;--surface:#191624;--surface2:#221e31;--ink:#f3f0ff;--text:#d3cde6;--soft:#9b94b4;--rule:#2e2942;
  --accent:#9b84ff;--accent-ink:#120a33;--accent-wash:#2a2250;--good:#45d39a;--good-wash:#123326;--bad:#ff7d93;--bad-wash:#3a1a22;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.3);color-scheme:dark;}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.55 var(--sans);-webkit-font-smoothing:antialiased;min-height:100vh}
h1,h2,h3{font-family:var(--display);color:var(--ink);margin:0;letter-spacing:-.01em}
h1{font-size:28px;line-height:1.15}h2{font-size:20px}h3{font-size:16px}
p{margin:.4em 0}
a{color:var(--accent)}
button,input,select{font:inherit;color:inherit}
.num,td.n,.mono{font-variant-numeric:tabular-nums}

/* shell */
.side{position:fixed;inset:0 auto 0 0;width:240px;background:var(--surface);border-right:1px solid var(--rule);padding:20px 14px;display:flex;flex-direction:column;gap:4px;z-index:5}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 18px}
.brand img{width:38px;height:38px}
.brand b{display:block;font-family:var(--display);color:var(--ink);font-size:15px;line-height:1.1}
.brand small{color:var(--soft);font-size:11.5px}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;text-decoration:none;color:var(--text);font-weight:600;font-size:14px}
.nav a:hover{background:var(--surface2)}
.nav a.on{background:var(--accent);color:var(--accent-ink)}
.nav svg{width:20px;height:20px;flex:none}
.side .grow{flex:1}
.sidehd{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--soft);margin:12px 10px 2px}
.head-sm{margin-bottom:6px}.head-sm h1{font-size:22px}
.side{overflow-y:auto}
.themebtn{display:flex;align-items:center;gap:10px;border:1px solid var(--rule);background:var(--surface2);border-radius:12px;padding:9px 12px;cursor:pointer;font-weight:600;font-size:13px}
main{margin-left:240px;padding:28px 32px 48px;max-width:1240px}
.topbar{display:none}
.bottom{display:none}

@media (max-width:899px){
  .side{display:none}
  main{margin:0;padding:12px 16px calc(88px + env(safe-area-inset-bottom))}
  .topbar{display:flex;position:sticky;top:0;z-index:5;align-items:center;gap:10px;padding:10px 16px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--rule)}
  .topbar img{width:30px;height:30px}
  .topbar b{font-family:var(--display);color:var(--ink);font-size:15px;flex:1}
  .topbar button{border:1px solid var(--rule);background:var(--surface);border-radius:10px;width:38px;height:38px;cursor:pointer;display:grid;place-items:center}
  .bottom{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--rule);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .bottom a{display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;color:var(--soft);font-size:10.5px;font-weight:600;padding:4px 0;border-radius:10px}
  .bottom a.on{color:var(--accent)}
  .bottom svg{width:22px;height:22px}
  h1{font-size:23px}
  main .g3{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .g3 .tile{padding:14px}
  .tile .ic{width:34px;height:34px;margin-bottom:8px}
  .tile h3{font-size:14.5px}
  .tile p{font-size:12px}
}

/* blocks */
.head{margin:6px 0 18px}
.head p{color:var(--soft);margin-top:4px}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.hero{background:linear-gradient(135deg,var(--accent) 0%,#9b4dff 55%,#ff5fa2 100%);color:#fff;border:none;padding:22px}
.hero h1{color:#fff}
.hero p{color:rgba(255,255,255,.88)}
.pill{display:inline-block;background:var(--lime);color:var(--lime-ink);font-weight:700;font-size:11.5px;letter-spacing:.04em;padding:3px 10px;border-radius:99px}
.tile{display:block;text-decoration:none;color:inherit;transition:transform .12s,border-color .12s}
.tile:hover{transform:translateY(-2px);border-color:var(--accent)}
.tile .ic{width:40px;height:40px;border-radius:12px;background:var(--accent-wash);color:var(--accent);display:grid;place-items:center;margin-bottom:10px}
.tile .ic svg{width:22px;height:22px}
.tile h3{margin-bottom:2px}
.tile p{color:var(--soft);font-size:13px;margin:0}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--soft);margin:22px 0 10px}

.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px;background:var(--surface2);border-radius:14px;margin-bottom:16px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;border:none;background:transparent;padding:8px 14px;border-radius:10px;font-weight:600;font-size:13.5px;color:var(--soft);cursor:pointer;white-space:nowrap}
.tabs button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

.tool{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:16px;align-items:start}
@media (max-width:1000px){.tool{grid-template-columns:minmax(0,1fr)}}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form .full{grid-column:1/-1}
@media (max-width:420px){.form{grid-template-columns:1fr}}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld span{font-size:12px;font-weight:600;color:var(--soft)}
.fld input,.fld select{width:100%;border:1.5px solid var(--rule);background:var(--surface);border-radius:10px;padding:10px 12px;font-size:15px;min-height:44px}
.fld input:focus,.fld select:focus{outline:none;border-color:var(--accent)}
.check{display:flex;gap:8px;align-items:center;font-weight:600;font-size:14px;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--accent)}
.note{font-size:12.5px;color:var(--soft)}

.big{font-family:var(--display);font-size:30px;font-weight:700;color:var(--ink);line-height:1.1}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:12px 0}
.kpi{background:var(--surface2);border-radius:12px;padding:12px}
.kpi small{display:block;font-size:11.5px;color:var(--soft);font-weight:600}
.kpi b{font-family:var(--display);font-size:19px;color:var(--ink)}
.win{background:var(--good-wash);color:var(--good);border-radius:12px;padding:10px 14px;font-weight:600;margin-bottom:10px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:8px 6px;border-bottom:1px solid var(--rule);text-align:left;vertical-align:top}
th{font-size:11.5px;color:var(--soft);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
td.n,th.n{text-align:right;white-space:nowrap}
tr.tot td{font-weight:700;color:var(--ink);border-top:2px solid var(--ink)}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.cmp th:not(:first-child),.cmp td:not(:first-child){text-align:right}
.better{color:var(--good)}

.btn{border:none;background:var(--accent);color:var(--accent-ink);font-weight:700;border-radius:12px;padding:11px 18px;cursor:pointer;min-height:44px}
.btn.ghost{background:var(--surface2);color:var(--ink)}
.btn:disabled{opacity:.5;cursor:default}

/* learn */
details{border:1px solid var(--rule);border-radius:14px;background:var(--surface);margin-bottom:10px;overflow:hidden}
summary{cursor:pointer;padding:14px 16px;font-weight:700;color:var(--ink);list-style:none;display:flex;justify-content:space-between;gap:10px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";color:var(--accent);font-size:20px;line-height:1}
details[open] summary::after{content:"–"}
details .body{padding:0 16px 14px}
details ul{padding-left:20px;margin:.4em 0}
details li{margin:.25em 0}
.formula{font-family:var(--mono);background:var(--surface2);border-radius:8px;padding:2px 7px;font-size:13px;color:var(--ink)}

/* quiz */
.opt{display:block;width:100%;text-align:left;border:1.5px solid var(--rule);background:var(--surface);border-radius:12px;padding:12px 14px;margin:8px 0;cursor:pointer;font-weight:500}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.ok{border-color:var(--good);background:var(--good-wash);color:var(--good)}
.opt.no{border-color:var(--bad);background:var(--bad-wash);color:var(--bad)}
.bar{height:6px;background:var(--surface2);border-radius:9px;overflow:hidden;margin:6px 0 14px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:9px}
.explain{background:var(--surface2);border-radius:12px;padding:10px 14px;font-size:14px;margin-top:6px}

/* dates */
.due{display:flex;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--rule)}
.due:last-child{border-bottom:none}
.day{width:52px;text-align:center;flex:none}
.day b{display:block;font-family:var(--display);font-size:22px;color:var(--ink);line-height:1}
.day small{font-size:10.5px;font-weight:700;letter-spacing:.08em;color:var(--accent)}
.due .what{flex:1;min-width:0}
.due .what b{color:var(--ink);display:block;font-size:14px}
.due .what small{color:var(--soft);font-size:12px}
.left{font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--accent-wash);color:var(--accent);white-space:nowrap}
.left.soon{background:var(--bad-wash);color:var(--bad)}
.foot{margin-top:28px;font-size:12px;color:var(--soft)}

/* syllabus */
:root{--ca:#2f62e9;--ca-wash:#e6edff;--cma:#0b8f7c;--cma-wash:#ddf4ef;--cs:#c23462;--cs-wash:#fbe4ec}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ca:#7ea2ff;--ca-wash:#1c2747;--cma:#4fd1bb;--cma-wash:#123430;--cs:#ff7fa6;--cs-wash:#3b1a27}}
:root[data-theme="dark"]{--ca:#7ea2ff;--ca-wash:#1c2747;--cma:#4fd1bb;--cma-wash:#123430;--cs:#ff7fa6;--cs-wash:#3b1a27}
.c-ca{--c:var(--ca);--cw:var(--ca-wash)}.c-cma{--c:var(--cma);--cw:var(--cma-wash)}.c-cs{--c:var(--cs);--cw:var(--cs-wash)}
.crumbs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;margin:2px 0 14px;color:var(--soft)}
.crumbs a{color:var(--soft);text-decoration:none;font-weight:600}.crumbs a:hover{color:var(--accent)}.crumbs b{color:var(--ink)}
.courses{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.ccard{display:block;text-decoration:none;color:inherit;border-top:4px solid var(--c);transition:transform .12s,box-shadow .12s}
.ccard:hover{transform:translateY(-2px)}
.ccard h2{margin:12px 0 2px;font-size:19px}
.cbadge{display:inline-grid;place-items:center;min-width:54px;height:54px;padding:0 10px;border-radius:14px;background:var(--cw);color:var(--c);font-family:var(--display);font-weight:700;font-size:20px;flex:none}
.cscheme{margin-top:10px;font-weight:600;color:var(--c);font-size:13.5px}
.cstats{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.cstats span,.chips span{background:var(--surface2);border-radius:99px;padding:3px 10px;font-size:12px;font-weight:600;color:var(--text)}
.schemecard{display:flex;gap:16px;align-items:flex-start;border-left:4px solid var(--c);margin-bottom:6px}
.schemecard h1{font-size:24px}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:6px 14px;font-size:13.5px;margin:6px 0}
.kv b{color:var(--ink)}
@media (max-width:560px){.schemecard{flex-direction:column}.kv{grid-template-columns:1fr}.kv b{margin-top:4px}}
.snote{background:var(--surface2);border-radius:10px;padding:9px 12px;font-size:13px;margin:8px 0}
.refs{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.refs a{font-size:12.5px;font-weight:600;text-decoration:none;background:var(--accent-wash);color:var(--accent);padding:5px 10px;border-radius:99px}
.stile h3{margin-bottom:4px}
.sbar{height:6px;background:var(--surface2);border-radius:9px;overflow:hidden;margin:10px 0 4px}
.sbar i{display:block;height:100%;background:var(--good);border-radius:9px;transition:width .25s}
.sbar.big{height:10px}
.subj{display:flex;flex-direction:column}
.subj.mine{outline:2px solid var(--accent)}
.subjlink{text-decoration:none;color:inherit;flex:1}
.subjlink:hover h3{color:var(--accent)}
.scode{font-size:12px;font-weight:700;letter-spacing:.04em;color:var(--soft);text-transform:uppercase}
.subj h3{margin:4px 0}
.paperhead{border-top:4px solid var(--c);margin-bottom:14px}
.paperhead h1{margin:6px 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.obj{color:var(--text);font-size:14px;margin:10px 0}
.secs{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px;margin:10px 0}
.secs div{display:flex;justify-content:space-between;gap:10px;background:var(--cw);border-radius:10px;padding:8px 12px;font-size:13px}
.secs b{color:var(--ink);font-weight:600}.secs span{color:var(--c);font-weight:700;white-space:nowrap}
.pbtns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.pbtns .btn{text-decoration:none;display:inline-flex;align-items:center;padding:9px 14px;min-height:40px;font-size:13.5px}
.notes{margin-bottom:14px}
.notes summary{padding:0;font-size:14px}
.secth{display:flex;justify-content:space-between;gap:10px;font-size:15px;margin:20px 2px 8px;color:var(--ink)}
.secth span{color:var(--soft);font-size:13px;font-family:var(--sans)}
.chap{margin-bottom:8px}
.chap summary{align-items:center;gap:10px;padding:12px 14px}
.chap summary::after{order:5}
.cno{flex:none;font-size:11.5px;font-weight:700;color:var(--soft);background:var(--surface2);border-radius:8px;padding:3px 8px}
.ctitle{flex:1;min-width:0}
.tag{flex:none;font-size:11.5px;font-weight:700;background:var(--accent-wash);color:var(--accent);border-radius:99px;padding:2px 8px}
.cprog{flex:none;font-size:12px;color:var(--soft);font-weight:600}
.cbox,.tick input{width:20px;height:20px;accent-color:var(--good);flex:none;cursor:pointer;margin:0}
.cbody{padding:0 14px 12px}
.tlist{list-style:none;margin:0;padding:0}
.tlist li{border-top:1px solid var(--rule)}
.tlist ul{list-style:none;margin:0 0 6px;padding:0 0 0 30px}
.tlist ul li{border-top:none}
.tick{display:flex;gap:10px;align-items:flex-start;padding:8px 0;cursor:pointer;font-size:14px}
.tick input{margin-top:1px}
.tick input:checked+span{color:var(--soft);text-decoration:line-through;text-decoration-color:var(--good)}
.chap.deleted{background:var(--surface2);border:1px dashed var(--rule);border-radius:14px;padding:10px 14px}
.chap.deleted .chead{display:flex;gap:10px;align-items:center}
.chap.deleted .ctitle{color:var(--soft)}

<script>
// ---------------------------------------------------------------- helpers
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const inr = n => isFinite(n) ? (n < 0 ? "−" : "") + "₹" + Math.round(Math.abs(n)).toLocaleString("en-IN") : "—";
const inr2 = n => isFinite(n) ? (n < 0 ? "−" : "") + "₹" + Math.abs(n).toLocaleString("en-IN", {minimumFractionDigits: 2, maximumFractionDigits: 2}) : "—";
const fmt = (n, d = 2) => isFinite(n) ? n.toLocaleString("en-IN", {maximumFractionDigits: d}) : "—";
const pct = (n, d = 2) => isFinite(n) ? fmt(n * 100, d) + "%" : "—";
const num = id => { const el = document.getElementById(id); const v = parseFloat(String(el ? el.value : "").replace(/,/g, "")); return isFinite(v) ? v : 0; };
const val = id => (document.getElementById(id) || {}).value;
const chk = id => !!(document.getElementById(id) || {}).checked;
const store = {
  get(k, d) { try { const v = localStorage.getItem("semi." + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("semi." + k, JSON.stringify(v)); } catch {} }
};
const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const f = (id, label, v = "", cls = "") => `<label class="fld ${cls}"><span>${label}</span><input id="${id}" inputmode="decimal" value="${v}"></label>`;
const sel = (id, label, opts, cls = "") => `<label class="fld ${cls}"><span>${label}</span><select id="${id}">${opts.map(o => Array.isArray(o) ? `<option value="${o[0]}">${o[1]}</option>` : `<option>${o}</option>`).join("")}</select></label>`;
const cb = (id, label, cls = "full") => `<label class="check ${cls}"><input type="checkbox" id="${id}">${label}</label>`;
const kpi = (label, v) => `<div class="kpi"><small>${label}</small><b>${v}</b></div>`;
const rows = r => `<table>${r.map(([k, v, c]) => `<tr class="${c || ""}"><td>${k}</td><td class="n">${v}</td></tr>`).join("")}</table>`;

// ---------------------------------------------------------------- icons
const P = {
  home: '<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  tax: '<path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6M9 16h3"/>',
  acc: '<path d="M4 4h16v16H4z"/><path d="M4 9h16M12 9v11"/>',
  cost: '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
  learn: '<path d="M2 6l10-4 10 4-10 4z"/><path d="M6 8v6c0 2 3 4 6 4s6-2 6-4V8"/>',
  quiz: '<circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6V14M12 17.5v.01"/>',
  cal: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  moon: '<path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/>',
  calc: '<rect x="5" y="2" width="14" height="20" rx="2"/><path d="M8 6h8M8 11h.01M12 11h.01M16 11h.01M8 15h.01M12 15h.01M16 15h.01M8 19h8"/>',
  book: '<path d="M4 4h6a3 3 0 0 1 3 3v13a2 2 0 0 0-2-2H4zM20 4h-6a3 3 0 0 0-3 3v13a2 2 0 0 1 2-2h7z"/>',
  clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  tool: '<path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.6 2.6-2.4-.6-.6-2.4z"/>',
  mail: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>',
  play: '<rect x="3" y="4" width="18" height="16" rx="3"/><path d="M10 9l5 3-5 3z"/>',
  user: '<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/>',
  spark: '<path d="M12 3l1.7 5L19 9.7l-5.3 1.7L12 17l-1.7-5.6L5 9.7 10.3 8z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/>'
};
const icon = k => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${P[k]}</svg>`;

// ---------------------------------------------------------------- theme
function applyTheme() {
  const t = store.get("theme", null);
  if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme;
  const dark = t ? t === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  $("#themeIc").innerHTML = icon(dark ? "sun" : "moon");
  $("#themeIc2").innerHTML = icon(dark ? "sun" : "moon");
  $("#themeTxt").textContent = dark ? "Light mode" : "Dark mode";
}
function toggleTheme() {
  const cur = document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  store.set("theme", cur === "dark" ? "light" : "dark");
  applyTheme();
}

// ================================================================ TAX TOOLS
// Slabs follow the Finance Act 2025 (FY 2025-26). Check later Budgets before relying on them.
const NEW_SLABS = [[400000, 0], [800000, .05], [1200000, .10], [1600000, .15], [2000000, .20], [2400000, .25], [Infinity, .30]];
const oldSlabs = age => { const ex = age === "80" ? 500000 : age === "60" ? 300000 : 250000;
  return [[ex, 0], [500000, .05], [1000000, .20], [Infinity, .30]]; };
function slabTax(income, slabs) {
  let tax = 0, prev = 0;
  for (const [lim, r] of slabs) { if (income > prev) tax += (Math.min(income, lim) - prev) * r; prev = Math.max(prev, lim); }
  return tax;
}
const SURCH = [[5000000, .10], [10000000, .15], [20000000, .25], [50000000, .37]];
function surcharge(income, tax, taxAt, cap) {
  const tiers = SURCH.map(([t, r]) => [t, Math.min(r, cap)]);
  let i = -1; tiers.forEach(([t], k) => { if (income > t) i = k; });
  if (i < 0) return 0;
  const [T, r] = tiers[i], prevR = i ? tiers[i - 1][1] : 0;
  let sc = tax * r;
  const limit = taxAt(T) * (1 + prevR) + (income - T);   // marginal relief
  if (tax + sc > limit) sc = Math.max(0, limit - tax);
  return sc;
}
function incomeTax(p, regime) {
  const isNew = regime === "new";
  const sd = p.salary > 0 ? Math.min(p.salary, isNew ? 75000 : 50000) : 0;
  const salaryInc = Math.max(0, p.salary - (isNew ? 0 : p.hra) - sd);
  const hp = isNew ? 0 : -Math.min(p.hl, 200000);
  const gti = Math.max(0, salaryInc + hp + p.other);
  const ded = isNew ? p.nps2 : Math.min(p.c80, 150000) + Math.min(p.d80, 100000) + Math.min(p.nps1, 50000) + p.nps2 + p.oth;
  const ti = Math.round(Math.max(0, gti - ded) / 10) * 10;
  const slabs = isNew ? NEW_SLABS : oldSlabs(p.age);
  const after87A = x => {
    const t = slabTax(x, slabs);
    if (isNew) { if (x <= 1200000) return Math.max(0, t - 60000); return Math.min(t, x - 1200000 + slabTax(1200000, slabs) - Math.min(slabTax(1200000, slabs), 60000)); }
    return x <= 500000 ? Math.max(0, t - 12500) : t;
  };
  const base = slabTax(ti, slabs), tax = after87A(ti), rebate = base - tax;
  const sc = surcharge(ti, tax, after87A, isNew ? .25 : .37);
  const cess = (tax + sc) * .04;
  return {sd, gti, ded, ti, base, rebate, tax, sc, cess, total: Math.round(tax + sc + cess), hp};
}
const T_ITAX = {
  id: "itax", name: "Income Tax", sub: "Old vs new regime, FY 2025-26",
  form: () => sel("age", "Age group", [["0", "Below 60"], ["60", "60 to 79"], ["80", "80 and above"]]) +
    f("salary", "Gross salary (₹)", 1500000) + f("other", "Other income (₹)", 0) +
    f("nps2", "Employer NPS 80CCD(2) (₹)", 0) +
    `<div class="full eyebrow" style="margin:6px 0 0">Old regime only</div>` +
    f("hra", "HRA exempt (₹)", 0) + f("hl", "Home loan interest 24(b) (₹)", 0) +
    f("c80", "80C (₹)", 150000) + f("d80", "80D (₹)", 25000) + f("nps1", "80CCD(1B) NPS (₹)", 0) + f("oth", "Other deductions (₹)", 0),
  calc() {
    const p = {age: val("age"), salary: num("salary"), other: num("other"), nps2: num("nps2"), hra: num("hra"), hl: num("hl"),
      c80: num("c80"), d80: num("d80"), nps1: num("nps1"), oth: num("oth")};
    const n = incomeTax(p, "new"), o = incomeTax(p, "old");
    const best = n.total <= o.total ? "new" : "old", save = Math.abs(n.total - o.total);
    const line = (k, a, b) => `<tr><td>${k}</td><td class="n">${a}</td><td class="n">${b}</td></tr>`;
    return `<div class="win">${save === 0 ? "Both regimes give the same tax." : `The ${best} regime saves you ${inr(save)}.`}</div>
      <div class="kpis">${kpi("New regime tax", inr(n.total))}${kpi("Old regime tax", inr(o.total))}${kpi("Monthly (best)", inr(Math.min(n.total, o.total) / 12))}</div>
      <div class="scroll"><table class="cmp"><tr><th>Item</th><th>New</th><th>Old</th></tr>
      ${line("Standard deduction", inr(n.sd), inr(o.sd))}${line("Loss from house property", inr(n.hp), inr(o.hp))}
      ${line("Gross total income", inr(n.gti), inr(o.gti))}${line("Chapter VI-A deductions", inr(n.ded), inr(o.ded))}
      ${line("Total income (rounded)", inr(n.ti), inr(o.ti))}${line("Tax on slabs", inr(n.base), inr(o.base))}
      ${line("Rebate u/s 87A", inr(n.rebate), inr(o.rebate))}${line("Surcharge", inr(n.sc), inr(o.sc))}
      ${line("Health & education cess 4%", inr(n.cess), inr(o.cess))}
      <tr class="tot"><td>Total tax</td><td class="n ${best === "new" ? "better" : ""}">${inr(n.total)}</td><td class="n ${best === "old" ? "better" : ""}">${inr(o.total)}</td></tr></table></div>

  form: () => f("cost", "Cost of asset (₹)", 500000) + f("salv", "Residual value (₹)", 50000) + f("life", "Useful life (years)", 5) +
    sel("meth", "Method", [["slm", "Straight line (SLM)"], ["wdv", "Written down value (WDV)"]]) + f("wrate", "WDV rate % (blank = compute from life)", "") + cb("half", "Used under 180 days in year 1 (half rate, IT Act)"),
  calc() {
    const C = num("cost"), S = num("salv"), L = Math.min(40, Math.max(1, Math.round(num("life")))), wdv = val("meth") === "wdv";
    let r = num("wrate") / 100;
    if (wdv && !r) r = C > 0 && S > 0 ? 1 - Math.pow(S / C, 1 / L) : 0;
    let open = C, t = "", sum = 0;
    for (let y = 1; y <= L; y++) {
      let d = wdv ? open * r : (C - S) / L;
      if (y === 1 && chk("half")) d /= 2;
      if (!wdv) d = Math.min(d, Math.max(0, open - S));
      sum += d;
      t += `<tr><td>${y}</td><td class="n">${inr(open)}</td><td class="n">${inr(d)}</td><td class="n">${inr(open - d)}</td></tr>`;
      open -= d;

    return `<div class="kpis">${kpi(wdv ? "WDV rate" : "Yearly depreciation", wdv ? pct(r) : inr((C - S) / L))}${kpi("Total depreciation", inr(sum))}${kpi("Closing value", inr(open))}</div>

const T_CVP = {
  id: "cvp", name: "Break-even (CVP)", sub: "Contribution, P/V ratio, BEP, margin of safety",
  form: () => f("fc", "Fixed costs (₹)", 300000) + f("sp", "Selling price per unit (₹)", 100) + f("vc", "Variable cost per unit (₹)", 60) +
    f("units", "Actual / budgeted sales (units)", 12000) + f("tp", "Target profit (₹)", 100000),
  calc() {
    const F = num("fc"), sp = num("sp"), vc = num("vc"), u = num("units"), tp = num("tp");
    const c = sp - vc, pv = sp ? c / sp : NaN, beu = c > 0 ? F / c : NaN, bes = beu * sp, profit = u * c - F, mos = u - beu;
    if (c <= 0) return `<div class="explain" style="color:var(--bad)">Selling price must be above variable cost, otherwise there is no contribution and no break-even point.</div>`;
    return `<div class="kpis">${kpi("BEP (units)", fmt(beu, 0))}${kpi("BEP (sales)", inr(bes))}${kpi("P/V ratio", pct(pv))}${kpi("Profit", inr(profit))}</div>` +
      rows([["Contribution per unit (SP − VC)", inr2(c)], ["Total contribution", inr(u * c)], ["Margin of safety (units)", fmt(mos, 0)],
        ["Margin of safety (₹)", inr(mos * sp)], ["Margin of safety %", pct(u ? mos / u : NaN)], ["Units for target profit", fmt((F + tp) / c, 0)], ["Sales for target profit", inr((F + tp) / pv)]]) +
      `<p class="note"><span class="formula">BEP = F ÷ contribution per unit</span> · <span class="formula">Profit = MOS × P/V</span></p>`;
  }
};
const T_EOQ = {
  id: "eoq", name: "EOQ & Stock Levels", sub: "Economic order quantity, re-order, min and max levels",
  form: () => f("A", "Annual demand (units)", 24000) + f("O", "Cost per order (₹)", 150) + f("Cc", "Carrying cost per unit per year (₹)", 2) +
    `<div class="full eyebrow" style="margin:6px 0 0">Stock levels (usage per day, lead time in days)</div>` +
    f("umax", "Maximum usage", 120) + f("umin", "Minimum usage", 60) + f("unor", "Normal usage", 90) +
    f("lmax", "Maximum lead time", 15) + f("lmin", "Minimum lead time", 5) + f("lnor", "Normal lead time", 10),
  calc() {
    const A = num("A"), O = num("O"), C = num("Cc");
    const q = C > 0 ? Math.sqrt(2 * A * O / C) : NaN, n = A / q;
    const rol = num("umax") * num("lmax"), min = rol - num("unor") * num("lnor"), max = rol + q - num("umin") * num("lmin");
    return `<div class="kpis">${kpi("EOQ (units)", fmt(q, 0))}${kpi("Orders a year", fmt(n, 1))}${kpi("Total cost at EOQ", inr(Math.sqrt(2 * A * O * C)))}</div>` +
      rows([["Ordering cost (A ÷ Q × O)", inr(n * O)], ["Carrying cost (Q ÷ 2 × C)", inr(q / 2 * C)], ["Re-order level (max usage × max lead time)", fmt(rol, 0) + " units"],
        ["Minimum level (ROL − normal usage × normal lead time)", fmt(min, 0) + " units"], ["Maximum level (ROL + ROQ − min usage × min lead time)", fmt(max, 0) + " units"],
        ["Average level (min + ½ ROQ)", fmt(min + q / 2, 0) + " units"]]) +
      `<p class="note"><span class="formula">EOQ = √(2AO ÷ C)</span>. EOQ is used as the re-order quantity (ROQ).</p>`;
  }
};
const T_EMI = {
  id: "emi", name: "EMI / Loan", sub: "Monthly instalment and yearly split",
  form: () => f("P", "Loan amount (₹)", 2500000) + f("R", "Interest rate (% a year)", 8.5) + f("Y", "Tenure (years)", 20),
  calc() {
    const Pr = num("P"), r = num("R") / 1200, n = Math.round(num("Y") * 12);
    if (!(Pr > 0) || !(n > 0) || r < 0) return `<p class="note">Enter a loan amount, a tenure above zero and an interest rate of 0% or more.</p>`;
    if (n > 600) return `<p class="note">Tenure can be at most 50 years.</p>`;
    const emi = r ? Pr * r * Math.pow(1 + r, n) / (Math.pow(1 + r, n) - 1) : Pr / n;
    let bal = Pr, t = "", yi = 0, yp = 0;
    for (let m = 1; m <= n; m++) {
      const i = bal * r, p = emi - i; bal -= p; yi += i; yp += p;
      if (m % 12 === 0 || m === n) { t += `<tr><td>${Math.ceil(m / 12)}</td><td class="n">${inr(yp)}</td><td class="n">${inr(yi)}</td><td class="n">${inr(Math.max(0, bal))}</td></tr>`; yi = yp = 0; }
    }
    return `<div class="kpis">${kpi("Monthly EMI", inr(emi))}${kpi("Total interest", inr(emi * n - Pr))}${kpi("Total payment", inr(emi * n))}</div>
      <div class="scroll" style="max-height:340px;overflow-y:auto"><table><tr><th>Year</th><th class="n">Principal</th><th class="n">Interest</th><th class="n">Balance</th></tr>${t}</table></div>
      <p class="note"><span class="formula">EMI = P·r·(1+r)ⁿ ÷ ((1+r)ⁿ − 1)</span></p>`;
  }
};
const T_NPV = {
  id: "npv", name: "NPV / IRR", sub: "Capital budgeting",
  form: () => f("c0", "Initial investment (₹)", 500000) + f("k", "Cost of capital (%)", 10) +
    `<label class="fld full"><span>Cash inflows, year 1 onwards (comma separated)</span><input id="cfs" value="150000, 180000, 200000, 160000, 120000"></label>`,
  calc() {
    const c0 = num("c0"), k = num("k") / 100;
    const cf = String(val("cfs")).split(/[,\s]+/).map(Number).filter(isFinite).filter((x, i, a) => a.length);
    const npvAt = r => cf.reduce((s, c, i) => s + c / Math.pow(1 + r, i + 1), -c0);
    const pv = npvAt(k) + c0;
    let lo = -0.99, hi = 10, irr = NaN;
    if (npvAt(lo) * npvAt(hi) < 0) { for (let i = 0; i < 200; i++) { const m = (lo + hi) / 2; (npvAt(m) > 0 ? lo = m : hi = m); } irr = (lo + hi) / 2; }
    let cum = 0, pb = NaN;
    cf.some((c, i) => { if (cum + c >= c0) { pb = i + (c0 - cum) / c; return true; } cum += c; });
    const t = cf.map((c, i) => { const df = 1 / Math.pow(1 + k, i + 1); return `<tr><td>${i + 1}</td><td class="n">${inr(c)}</td><td class="n">${df.toFixed(4)}</td><td class="n">${inr(c * df)}</td></tr>`; }).join("");
    return `<div class="win" style="${npvAt(k) < 0 ? "background:var(--bad-wash);color:var(--bad)" : ""}">${npvAt(k) >= 0 ? "Accept: NPV is positive." : "Reject: NPV is negative."}</div>
      <div class="kpis">${kpi("NPV", inr(npvAt(k)))}${kpi("IRR", pct(irr))}${kpi("Profitability index", fmt(c0 ? pv / c0 : NaN))}${kpi("Payback", isFinite(pb) ? fmt(pb) + " yrs" : "Not recovered")}</div>
      <div class="scroll"><table><tr><th>Year</th><th class="n">Cash flow</th><th class="n">PV factor</th><th class="n">Present value</th></tr>${t}
      <tr class="tot"><td colspan="3">PV of inflows − investment</td><td class="n">${inr(npvAt(k))}</td></tr></table></div>`;
  }
};

const YEARLY = [[5, 15, "Advance tax · 1st instalment", "15% of tax"], [8, 15, "Advance tax · 2nd instalment", "45% cumulative"], [11, 15, "Advance tax · 3rd instalment", "75% cumulative"],

function upcoming(days = 60) {
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const out = [];
  for (let k = 0; k < 3; k++) {
    const y = today.getFullYear(), m = today.getMonth() + k;
    MONTHLY.forEach(([d, n, w]) => out.push([new Date(y, m, d), n, w]));
  }
  for (const yr of [today.getFullYear(), today.getFullYear() + 1]) YEARLY.forEach(([m, d, n, w]) => out.push([new Date(yr, m, d), n, w]));
  return out.map(([d, n, w]) => [d, n, w, Math.round((d - today) / 864e5)]).filter(x => x[3] >= 0 && x[3] <= days).sort((a, b) => a[0] - b[0]);
}

  ["tax", "Section 80D allows a deduction for:", ["Medical insurance premium", "Education loan interest", "Donations", "Rent paid"], "80E is education loan interest, 80G donations, 80GG rent."],
  ["tax", "TDS on salary is deducted under Section:", ["192", "194J", "194C", "194A"], "Sec. 192, at the employee's average rate."],
  ["acc", "Golden rule for a real account:", ["Debit what comes in, credit what goes out", "Debit the receiver, credit the giver", "Debit expenses, credit incomes", "Debit the giver, credit the receiver"], "Real accounts are assets, so debit what comes in."],
  ["acc", "The accounting equation is:", ["Assets = Liabilities + Capital", "Assets = Capital − Liabilities", "Capital = Assets + Liabilities", "Liabilities = Assets + Capital"], "It reflects the dual aspect concept."],
  ["acc", "Goods withdrawn by the proprietor for personal use are debited to:", ["Drawings A/c", "Purchases A/c", "Capital A/c", "Sales A/c"], "Drawings A/c Dr, To Purchases A/c."],
  ["acc", "The concept that assumes the business will continue indefinitely is:", ["Going concern", "Business entity", "Money measurement", "Accrual"], "Going concern is why assets are shown at cost less depreciation, not break-up value."],
  ["acc", "Prepaid expenses are shown in the balance sheet as a:", ["Current asset", "Current liability", "Fixed asset", "Revenue item"], "The benefit is still to be received, so it is an asset."],
  ["acc", "Under the WDV method, the depreciation charge each year:", ["Decreases", "Stays the same", "Increases", "Is zero after year 1"], "A fixed rate applies to a falling book value."],

  ["acc", "Quick (liquid) ratio excludes from current assets:", ["Inventory and prepaid expenses", "Cash", "Debtors", "Bank balance"], "Inventory and prepaids cannot be turned into cash quickly."],

let qz = null;
function renderQuiz() {
  if (!qz) {
    const best = store.get("best", {});
    const card = (k, n, d) => `<button class="card tile" style="text-align:left;cursor:pointer;width:100%" onclick="startQuiz('${k}')"><div class="ic">${icon("quiz")}</div><h3>${n}</h3><p>${d} · best ${best[k] != null ? best[k] + "/10" : "—"}</p></button>`;
    $("#app").innerHTML = `<div class="head"><h1>Quiz</h1><p>10 random MCQs per round, with an explanation after each answer.</p></div>
      <div class="grid g3">${card("tax", "Income Tax & GST", QUIZ.filter(q => q[0] === "tax").length + " questions")}${card("acc", "Accounting", QUIZ.filter(q => q[0] === "acc").length + " questions")}${card("cost", "Cost Accounting", QUIZ.filter(q => q[0] === "cost").length + " questions")}${card("mix", "Mixed bag", "All subjects")}</div>`;
    return;
  }
  if (qz.i >= qz.qs.length) {
    const best = store.get("best", {}), k = qz.k;
    if (k !== "mix" && (best[k] == null || qz.score > best[k])) { best[k] = qz.score; store.set("best", best); }
    $("#app").innerHTML = `<div class="card" style="max-width:640px;text-align:center;padding:32px"><div class="big">${qz.score} / ${qz.qs.length}</div>
      <p>${qz.score >= 8 ? "Excellent, you're exam-ready on this." : qz.score >= 5 ? "Good going. Revise the ones you missed." : "Keep practising. Open the notes and try again."}</p>
      <div style="display:flex;gap:10px;justify-content:center;margin-top:12px;flex-wrap:wrap"><button class="btn" onclick="startQuiz('${k}')">Play again</button><button class="btn ghost" onclick="qz=null;renderQuiz()">Choose subject</button></div></div>`;
    return;
  }
  const [, q, opts, why] = qz.qs[qz.i];
  $("#app").innerHTML = `<div class="card" style="max-width:680px"><div style="display:flex;justify-content:space-between" class="note"><span>Question ${qz.i + 1} of ${qz.qs.length}</span><span>Score ${qz.score}</span></div>
    <div class="bar"><i style="width:${qz.i / qz.qs.length * 100}%"></i></div><h2 style="font-size:18px;line-height:1.35">${q}</h2>
    <div id="opts">${qz.order.map(o => `<button class="opt" data-o="${o}">${opts[o]}</button>`).join("")}</div><div id="qx"></div></div>`;
  $$("#opts .opt").forEach(b => b.onclick = () => {
    const pick = +b.dataset.o;
    $$("#opts .opt").forEach(x => { x.disabled = true; if (+x.dataset.o === 0) x.classList.add("ok"); });
    if (pick === 0) qz.score++; else b.classList.add("no");
    $("#qx").innerHTML = `<div class="explain">${why}</div><button class="btn" style="margin-top:12px" onclick="qz.i++;qz.order=shuffle([0,1,2,3]);renderQuiz()">${qz.i + 1 < qz.qs.length ? "Next question" : "See result"}</button>`;
  });
}
function startQuiz(k) { qz = {k, i: 0, score: 0, qs: shuffle(QUIZ.filter(q => k === "mix" || q[0] === k)).slice(0, 10), order: shuffle([0, 1, 2, 3])}; renderQuiz(); }

// ---------------------------------------------------------------- boot
applyTheme();
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", applyTheme);
addEventListener("hashchange", () => { if (route.sec !== "quiz") qz = null; go(); });
// App editions can ship a preset: the Android CMA Intermediate edition reports "cma-inter" through its bridge.
(function applyPreset() {
  let p = null;
  try { p = new URLSearchParams(location.search).get("preset") || (window.AndroidBridge && AndroidBridge.preset && AndroidBridge.preset()); } catch (e) {}
  if (p !== "cma-inter" || store.get("plan.cfg", null)) return;           // only on a fresh install
  store.set("syl.course", "cma");
  const st = store.get("syl.stage", {}); st.cma = st.cma || "int1"; store.set("syl.stage", st);
  presetCmaInterPlan();
})();
// First launch: start on the course picker (CA / CMA / CS).
if (!location.hash && !store.get("syl.course", null)) location.replace("#/syllabus");
go();
if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register("sw.js").catch(() => {});
try { localStorage.removeItem("semi.upd.trial"); } catch (e) {}     // this start worked
</script>
